name: Security Scan

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Runs every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  security-scans:
    name: Security Scans + Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (JSON)
        id: npm_audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true

      - name: Run Trivy file system scan (JSON)
        id: trivy
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Run Gitleaks secret scan (JSON)
        id: gitleaks
        uses: zricethezav/gitleaks-action@v2
        continue-on-error: true
        with:
          args: detect --source . --report-format json --report-path gitleaks-report.json --redact

      - name: Build security summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function readJson(path, fallback) {
            if (!fs.existsSync(path)) return fallback;
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch {
              return fallback;
            }
          }

          const npmAudit = readJson('npm-audit.json', {});
          const npmVulnMeta = npmAudit.metadata?.vulnerabilities || {};
          const npmTotal = Object.values(npmVulnMeta).reduce((a, b) => a + (Number(b) || 0), 0);

          const trivy = readJson('trivy-report.json', { Results: [] });
          const trivySev = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
          for (const result of trivy.Results || []) {
            for (const v of result.Vulnerabilities || []) {
              if (trivySev[v.Severity] !== undefined) trivySev[v.Severity] += 1;
            }
          }
          const trivyTotal = Object.values(trivySev).reduce((a, b) => a + b, 0);

          const gitleaks = readJson('gitleaks-report.json', []);
          const gitleaksTotal = Array.isArray(gitleaks) ? gitleaks.length : 0;

          const lines = [];
          lines.push('## Security Scan Summary');
          lines.push('');
          lines.push('| Scanner | Critical | High | Medium | Low | Total |');
          lines.push('|---|---:|---:|---:|---:|---:|');
          lines.push(`| npm audit | ${npmVulnMeta.critical || 0} | ${npmVulnMeta.high || 0} | ${npmVulnMeta.moderate || 0} | ${npmVulnMeta.low || 0} | ${npmTotal} |`);
          lines.push(`| Trivy (fs) | ${trivySev.CRITICAL} | ${trivySev.HIGH} | ${trivySev.MEDIUM} | ${trivySev.LOW} | ${trivyTotal} |`);
          lines.push(`| Gitleaks (secrets) | 0 | 0 | 0 | 0 | ${gitleaksTotal} |`);
          lines.push('');
          lines.push(`- npm audit vulnerabilities: ${npmTotal}`);
          lines.push(`- Trivy vulnerabilities: ${trivyTotal}`);
          lines.push(`- Potential leaked secrets (Gitleaks): ${gitleaksTotal}`);

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');

          console.log('--- Security Summary ---');
          console.log(lines.join('\n'));

          fs.appendFileSync(process.env.GITHUB_ENV, `NPM_AUDIT_TOTAL=${npmTotal}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `NPM_AUDIT_CRITICAL=${npmVulnMeta.critical || 0}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `NPM_AUDIT_HIGH=${npmVulnMeta.high || 0}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `TRIVY_TOTAL=${trivyTotal}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `TRIVY_CRITICAL=${trivySev.CRITICAL}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `TRIVY_HIGH=${trivySev.HIGH}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `GITLEAKS_TOTAL=${gitleaksTotal}\n`);
          NODE

      - name: Upload raw scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            npm-audit.json
            trivy-report.json
            gitleaks-report.json
          if-no-files-found: warn

      - name: Enforce security policy (fail on High/Critical/Secrets)
        if: always()
        shell: bash
        run: |
          echo "NPM high+critical: $((NPM_AUDIT_HIGH + NPM_AUDIT_CRITICAL))"
          echo "Trivy high+critical: $((TRIVY_HIGH + TRIVY_CRITICAL))"
          echo "Gitleaks findings: ${GITLEAKS_TOTAL}"

          if [ $((NPM_AUDIT_HIGH + NPM_AUDIT_CRITICAL)) -gt 0 ] || \
             [ $((TRIVY_HIGH + TRIVY_CRITICAL)) -gt 0 ] || \
             [ "${GITLEAKS_TOTAL}" -gt 0 ]; then
            echo "Security policy failed: high-risk vulnerabilities or leaked secrets detected."
            exit 1
          fi
